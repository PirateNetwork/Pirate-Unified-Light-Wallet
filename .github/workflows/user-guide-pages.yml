name: Docs - Stashi Wallet User Guide

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/user-guide-pages.yml"
      - "app/assets/icons/stashi-wallet-logo.png"
      - "app/assets/icons/stashi-wallet-logo.svg"
      - "app/test/guide_capture_test.dart"
      - "docs/user-guide/**"
      - "scripts/docs/**"
  pull_request:
    branches: [main, develop]
    paths:
      - ".github/workflows/user-guide-pages.yml"
      - "app/assets/icons/stashi-wallet-logo.png"
      - "app/assets/icons/stashi-wallet-logo.svg"
      - "app/test/guide_capture_test.dart"
      - "docs/user-guide/**"
      - "scripts/docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "stashi-user-guide-pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate guide
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/docs/requirements.txt

      - name: Install guide dependencies
        run: python -m pip install --no-deps --requirement scripts/docs/requirements.txt

      - name: Build Pages content
        run: |
          mkdir -p _site/assets
          python scripts/docs/build_stashi_user_guide.py \
            --output _site/Stashi-Wallet-User-Guide.pdf
          python scripts/docs/verify_stashi_user_guide.py \
            _site/Stashi-Wallet-User-Guide.pdf
          cp docs/user-guide/pages/index.html _site/index.html
          cp docs/user-guide/pages/robots.txt _site/robots.txt
          cp docs/user-guide/pages/.nojekyll _site/.nojekyll
          cp app/assets/icons/stashi-wallet-logo.svg \
            _site/assets/stashi-wallet-logo.svg
          cp app/assets/icons/stashi-wallet-logo.png \
            _site/assets/stashi-wallet-logo.png
          python scripts/docs/verify_user_guide_site.py _site

      - name: Upload guide for review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: stashi-wallet-user-guide-${{ github.sha }}
          path: _site/
          if-no-files-found: error
          retention-days: 14

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site/

  deploy:
    name: Publish approved guide
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
